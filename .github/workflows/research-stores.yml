name: Manual store-browser research
on: workflow_dispatch
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.64.1
      - name: Test the ordinary store selector once
        run: python research_store_browser.py
